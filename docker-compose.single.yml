services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting}
      POSTGRES_DB: opspilot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs -d opspilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args:
        INSTALL_RERANK: "false"
    container_name: opspilot-single
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: opspilot
      APP_ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://cs:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting}@postgres:5432/opspilot
      REDIS_URL: redis://redis:6379/0
      # 单机模式不启动 Qdrant，向量检索使用进程内实现。
      QDRANT_URL: ""
      QDRANT_COLLECTION: ops_knowledge
      PENDING_STORE_BACKEND: redis
      OPS_TOOL_BACKEND: mock
      OPS_ENABLE_WRITE_TOOLS: "false"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LOCAL_EMBEDDING_ENABLED: ${LOCAL_EMBEDDING_ENABLED:-false}
      CROSS_ENCODER_ENABLED: ${CROSS_ENCODER_ENABLED:-false}
      UNSTRUCTURED_ENABLED: ${UNSTRUCTURED_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
